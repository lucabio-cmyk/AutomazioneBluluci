blueprint:
  name: "Auto Luci Movimento + mmWave + Lux (Giorno/Notte) - Robusto"
  description: >-
    Accensione/spegnimento luci basato su movimento e luminosità, con profili giorno/notte,
    override manuale, debounce e supporto multi-luce.
    Opzionali: fino a due sensori mmWave (radar) per tenere accesa la luce con presenza stazionaria,
    rilevamento notte via sensore lux esterno (crepuscolare), accensione automatica al calo di lux,
    luminosità adattiva, temperatura colore circadiana, pre-spegnimento con dissolvenza e secondo
    sensore di movimento per open space (OR all'accensione, AND allo spegnimento).
  domain: automation
  # Le sezioni di input (blueprint.input con gruppi collassabili) richiedono HA >= 2024.6.0.
  homeassistant:
    min_version: "2024.6.0"
  source_url: https://raw.githubusercontent.com/lucabio-cmyk/AutomazioneBluluci/main/blueprints/automation/automazione_bluluci/pir_lux_day_night.yaml

  input:
    # ─────────────────────────────────────────────────────────────
    # ESSENZIALI (sempre visibili)
    # ─────────────────────────────────────────────────────────────
    presence_sensor:
      name: Sensore di movimento
      description: Binary sensor che indica movimento/presenza (on/off).
      selector:
        entity:
          domain: binary_sensor

    lux_sensor:
      name: Sensore luminosità (lux)
      description: >-
        Sensore lux per il controllo accensione e, in modalità lux_based, per il rilevamento notte.
        Ideale un sensore crepuscolare esterno.
      selector:
        entity:
          domain: sensor

    light_target:
      name: Luci target
      description: Una o più luci da controllare.
      selector:
        target:
          entity:
            domain: light

    # ─────────────────────────────────────────────────────────────
    # SENSORI AGGIUNTIVI (opzionali)
    # ─────────────────────────────────────────────────────────────
    advanced_sensors:
      name: 🛰️ Sensori aggiuntivi (opzionali)
      icon: mdi:radar
      collapsed: true
      input:
        presence_sensor_2:
          name: Sensore di movimento 2 (open space)
          description: >-
            Secondo sensore di movimento per open space (es. sala + cucina).
            Logica OR all'accensione (basta uno dei due) e AND allo spegnimento
            (entrambi liberi prima del countdown). Lascia vuoto per zona singola.
          default: ""
          selector:
            entity:
              domain: binary_sensor

        mmwave_sensor:
          name: Sensore mmWave / radar 1
          description: >-
            Radar mmWave (es. LD2410/LD2450, Tuya) per presenza stazionaria.
            Impedisce lo spegnimento finché rileva presenza, anche senza movimento PIR.
            Lascia vuoto se non lo hai.
          default: ""
          selector:
            entity:
              domain: binary_sensor

        mmwave_sensor_2:
          name: Sensore mmWave / radar 2
          description: >-
            Secondo radar per open space o copertura estesa. OR per tenere accesa
            (basta uno attivo), AND per consentire lo spegnimento (entrambi liberi).
          default: ""
          selector:
            entity:
              domain: binary_sensor

        enable_mmwave_timeout:
          name: Abilita timeout massimo mmWave
          description: >-
            Se attivo, applica un timeout massimo di sicurezza al mantenimento luce via mmWave.
            Se disattivato, la luce resta accesa finché almeno un mmWave rileva presenza.
          default: true
          selector:
            boolean: {}

        mmwave_keep_on_timeout_seconds:
          name: Timeout massimo mantenimento luce mmWave (s)
          description: >-
            Tempo massimo aggiuntivo (dopo il timeout base assenza movimento) per cui la luce
            resta accesa se un mmWave rileva ancora presenza. Allo scadere si spegne comunque
            (anti-blocco). Ignorato se il timeout mmWave è disattivato.
          default: 600
          selector:
            number:
              min: 30
              max: 3600
              step: 30
              mode: box
              unit_of_measurement: s

        twilight_sensor:
          name: Sensore crepuscolare esterno (per rilevamento notte)
          description: >-
            Sensore lux dedicato al solo rilevamento notte in modalità lux_based.
            Se vuoto, viene usato il sensore luminosità principale.
          default: ""
          selector:
            entity:
              domain: sensor

    # ─────────────────────────────────────────────────────────────
    # COMPORTAMENTO GENERALE
    # ─────────────────────────────────────────────────────────────
    general:
      name: ⚙️ Comportamento generale
      icon: mdi:cog
      collapsed: true
      input:
        automation_enabled:
          name: Automazione abilitata
          description: Disabilita rapidamente la logica senza rimuovere l'automazione.
          default: true
          selector:
            boolean: {}

        manual_override_helper:
          name: Helper override manuale (opzionale)
          description: >-
            input_boolean che, se ON, sospende la logica automatica.
            Utile per blocco temporaneo dopo comando manuale.
          default: ""
          selector:
            entity:
              domain: input_boolean

        keep_auto_off_during_override:
          name: Mantieni spegnimento auto durante override
          description: Se attivo, durante override l'automazione NON accende ma può ancora spegnere su assenza.
          default: true
          selector:
            boolean: {}

        skip_if_light_already_on:
          name: Salta accensione se luce già ON
          description: Evita chiamate inutili quando almeno una luce target è già accesa.
          default: true
          selector:
            boolean: {}

        min_time_between_runs_seconds:
          name: Tempo minimo tra nuove accensioni (s)
          description: Antirimbalzo logico per evitare comandi ON troppo ravvicinati.
          default: 2
          selector:
            number:
              min: 0
              max: 300
              step: 1
              mode: box
              unit_of_measurement: s

        motion_on_debounce_seconds:
          name: Debounce movimento ON (s)
          description: Il movimento deve restare ON per questo tempo prima del trigger.
          default: 0
          selector:
            number:
              min: 0
              max: 30
              step: 1
              mode: slider
              unit_of_measurement: s

        motion_off_debounce_seconds:
          name: Debounce assenza OFF (s)
          description: L'assenza deve restare OFF per questo tempo prima del trigger.
          default: 0
          selector:
            number:
              min: 0
              max: 30
              step: 1
              mode: slider
              unit_of_measurement: s

    # ─────────────────────────────────────────────────────────────
    # GIORNO / NOTTE
    # ─────────────────────────────────────────────────────────────
    day_night:
      name: 🌗 Giorno / Notte
      icon: mdi:theme-light-dark
      collapsed: true
      input:
        enable_night_mode:
          name: Abilita profilo notte
          description: Se disattivato viene sempre usato il profilo giorno.
          default: true
          selector:
            boolean: {}

        night_detection_mode:
          name: Rilevamento notte
          description: >-
            Come determinare se è notte:
            - Orario: fascia oraria fissa (es. 22:30 – 06:30).
            - Sole: tramonto/alba con offset opzionali.
            - Lux esterno: usa il sensore crepuscolare (o il lux principale se non impostato).
              Se lux < soglia notte → profilo notte. Ideale con sensori crepuscolari esterni.
          default: time_based
          selector:
            select:
              options:
                - label: Basato su orario
                  value: time_based
                - label: Basato su sole
                  value: sun_based
                - label: Basato su lux esterno (crepuscolare)
                  value: lux_based

        night_start_time:
          name: Inizio notte (modalità oraria)
          description: Usato solo se rilevamento notte = orario.
          default: "22:30:00"
          selector:
            time: {}

        night_end_time:
          name: Fine notte (modalità oraria)
          description: Usato solo se rilevamento notte = orario.
          default: "06:30:00"
          selector:
            time: {}

        sunset_offset_minutes:
          name: Offset tramonto (min, modalità sole)
          description: Negativi anticipano la notte, positivi la ritardano.
          default: 0
          selector:
            number:
              min: -180
              max: 180
              step: 1
              mode: box
              unit_of_measurement: min

        sunrise_offset_minutes:
          name: Offset alba (min, modalità sole)
          description: Negativi anticipano la fine notte, positivi la estendono.
          default: 0
          selector:
            number:
              min: -180
              max: 180
              step: 1
              mode: box
              unit_of_measurement: min

        lux_night_detection_threshold:
          name: Soglia lux per profilo notte (modalità lux esterno)
          description: >-
            Usato solo in modalità lux esterno. Se il lux esterno legge SOTTO questa soglia
            → profilo notte (luminosità ridotta, colore caldo, timeout più breve).
            Es. 30-80 lx per crepuscolo. Indipendente da "Soglia lux giorno" (quella decide
            SE le luci si accendono; questa decide QUALE profilo usare).
          default: 50
          selector:
            number:
              min: 0
              max: 1000
              step: 1
              mode: slider
              unit_of_measurement: lx

    # ─────────────────────────────────────────────────────────────
    # ACCENSIONE & LUMINOSITÀ
    # ─────────────────────────────────────────────────────────────
    turn_on:
      name: 💡 Accensione & Luminosità
      icon: mdi:lightbulb-on
      collapsed: true
      input:
        enable_lux_check:
          name: Abilita controllo lux in accensione
          default: true
          selector:
            boolean: {}

        lux_fallback_value:
          name: Lux fallback (sensore unknown/unavailable)
          description: >-
            Valore usato quando il sensore lux non è valido. Il default alto (999) evita
            accensioni indesiderate, ma se il tuo sensore va spesso "unavailable" può impedire
            l'accensione: in quel caso abbassalo sotto la soglia giorno.
          default: 999
          selector:
            number:
              min: 0
              max: 5000
              step: 1
              mode: box
              unit_of_measurement: lx

        day_lux_threshold:
          name: Soglia lux giorno
          description: >-
            Sopra questa soglia le luci NON si accendono in profilo giorno (già abbastanza chiaro).
            Usata anche come soglia per il trigger di calo lux.
          default: 120
          selector:
            number:
              min: 0
              max: 5000
              step: 1
              mode: slider
              unit_of_measurement: lx

        night_lux_threshold:
          name: Soglia lux notte
          description: >-
            Sopra questa soglia le luci NON si accendono in profilo notte.
            Di solito più bassa della soglia giorno.
          default: 20
          selector:
            number:
              min: 0
              max: 5000
              step: 1
              mode: slider
              unit_of_measurement: lx

        enable_lux_trigger:
          name: Accensione automatica al calo di lux (crepuscolo)
          description: >-
            Se attivo, quando il lux scende sotto la soglia del profilo attivo E c'è già presenza,
            le luci si accendono senza attendere un nuovo movimento PIR. Ideale con sensore
            crepuscolare esterno. Soglia = "Soglia lux giorno", stabile per il tempo configurato.
          default: false
          selector:
            boolean: {}

        lux_trigger_stability_seconds:
          name: Stabilità lux prima del trigger (s)
          description: >-
            Il lux deve restare sotto soglia per almeno questo tempo prima dell'accensione automatica.
            Evita accensioni spurie per nuvole passeggere. Consigliato 30-120 s.
          default: 60
          selector:
            number:
              min: 5
              max: 600
              step: 5
              mode: slider
              unit_of_measurement: s

        day_brightness_pct:
          name: Luminosità giorno (%)
          default: 85
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"

        night_brightness_pct:
          name: Luminosità notte (%)
          default: 25
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"

        day_transition_seconds:
          name: Transizione accensione giorno (s)
          default: 1
          selector:
            number:
              min: 0
              max: 30
              step: 1
              mode: slider
              unit_of_measurement: s

        night_transition_seconds:
          name: Transizione accensione notte (s)
          default: 1
          selector:
            number:
              min: 0
              max: 30
              step: 1
              mode: slider
              unit_of_measurement: s

        enable_adaptive_brightness:
          name: Abilita luminosità adattiva al lux
          description: >-
            Se attivo, la luminosità si adatta al lux ambiente: più buio → più luce,
            lux vicino alla soglia → luce al minimo configurato. Interpolazione lineare.
            Solo in modalità "Controllo luminosità" e con controllo lux abilitato.
          default: false
          selector:
            boolean: {}

        adaptive_brightness_min_pct:
          name: Luminosità adattiva minima (%)
          description: Luminosità minima quando il lux è vicino alla soglia. La luce non scende sotto questo valore.
          default: 20
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"

    # ─────────────────────────────────────────────────────────────
    # SPEGNIMENTO
    # ─────────────────────────────────────────────────────────────
    turn_off:
      name: 🌙 Spegnimento
      icon: mdi:lightbulb-off
      collapsed: true
      input:
        day_no_motion_timeout_seconds:
          name: Timeout assenza giorno (s)
          default: 180
          selector:
            number:
              min: 5
              max: 7200
              step: 1
              mode: box
              unit_of_measurement: s

        night_no_motion_timeout_seconds:
          name: Timeout assenza notte (s)
          default: 90
          selector:
            number:
              min: 5
              max: 7200
              step: 1
              mode: box
              unit_of_measurement: s

        enable_pre_off_dim:
          name: Pre-spegnimento con dissolvenza (avviso visivo)
          description: >-
            Prima di spegnere, porta le luci a bassa intensità per qualche secondo come avviso.
            Se torna il movimento durante l'avviso, le luci tornano piene e il timer riparte.
          default: false
          selector:
            boolean: {}

        pre_off_dim_brightness_pct:
          name: Luminosità pre-spegnimento (%)
          description: Intensità ridotta durante la fase di avviso.
          default: 10
          selector:
            number:
              min: 1
              max: 50
              step: 1
              mode: slider
              unit_of_measurement: "%"

        pre_off_dim_duration_seconds:
          name: Durata avviso pre-spegnimento (s)
          description: Tempo a bassa intensità prima dello spegnimento definitivo.
          default: 15
          selector:
            number:
              min: 3
              max: 120
              step: 1
              mode: slider
              unit_of_measurement: s

        off_transition_seconds:
          name: Transizione allo spegnimento (s)
          description: Dissolvenza morbida allo spegnimento (e nel pre-spegnimento). 0 = immediato.
          default: 2
          selector:
            number:
              min: 0
              max: 30
              step: 1
              mode: slider
              unit_of_measurement: s

        enable_lux_off:
          name: Spegni quando c'è abbastanza luce naturale
          description: >-
            Se attivo, quando il sensore lux sale sopra la "Soglia lux spegnimento" per il tempo
            di stabilità configurato, le luci si spengono ANCHE se c'è presenza (risparmio
            energetico: c'è già abbastanza luce diurna).
            IMPORTANTE: imposta la "Soglia lux spegnimento" >= "Soglia lux giorno" per evitare
            che la luce si accenda e spenga in continuazione (serve una banda di isteresi tra
            la soglia che accende e quella che spegne). Se hai attivo anche il trigger di calo
            lux, quando poi torna il buio e sei in stanza le luci si riaccendono da sole.
          default: false
          selector:
            boolean: {}

        lux_off_threshold:
          name: Soglia lux spegnimento
          description: >-
            Sopra questo valore di lux (stabile per il tempo sotto) le luci si spengono.
            Impostala su un livello di piena luce diurna e >= "Soglia lux giorno".
          default: 250
          selector:
            number:
              min: 0
              max: 5000
              step: 1
              mode: slider
              unit_of_measurement: lx

        lux_off_stability_seconds:
          name: Stabilità lux prima dello spegnimento (s)
          description: >-
            Il lux deve restare sopra la soglia per almeno questo tempo prima di spegnere.
            Evita spegnimenti per lampi di luce momentanei. Consigliato 60-180 s.
          default: 120
          selector:
            number:
              min: 5
              max: 900
              step: 5
              mode: slider
              unit_of_measurement: s

    # ─────────────────────────────────────────────────────────────
    # TEMPERATURA COLORE (bianco)
    # ─────────────────────────────────────────────────────────────
    color_temp:
      name: 🎨 Temperatura colore (bianco)
      icon: mdi:thermometer
      collapsed: true
      input:
        enable_color_temp:
          name: Abilita controllo temperatura colore
          description: >-
            Imposta la temperatura colore (bianco caldo/freddo) all'accensione, differenziata
            giorno/notte. Solo con luci CCT/RGBW.
          default: false
          selector:
            boolean: {}

        day_color_temp_kelvin:
          name: Temperatura colore giorno (K)
          description: Valori alti = bianco più freddo (4000K neutro, 6500K luce del giorno).
          default: 4000
          selector:
            number:
              min: 2000
              max: 6500
              step: 100
              mode: slider
              unit_of_measurement: K

        night_color_temp_kelvin:
          name: Temperatura colore notte (K)
          description: Valori bassi = bianco più caldo (2700K caldo, ideale per la sera).
          default: 2700
          selector:
            number:
              min: 2000
              max: 6500
              step: 100
              mode: slider
              unit_of_measurement: K

        enable_circadian_color_temp:
          name: Temperatura colore circadiana (transizione continua)
          description: >-
            La temperatura colore varia con continuità seguendo l'elevazione solare (curva
            multi-fase con smoothstep): notte a night_k, alba/tramonto graduali, giorno a day_k,
            picco mezzogiorno opzionale a noon_k. Richiede il controllo temperatura colore
            attivo e l'entità elevazione solare.
          default: false
          selector:
            boolean: {}

        solar_elevation_entity:
          name: Entità elevazione solare
          description: >-
            Sensore con l'elevazione solare in gradi (es. un template sensor sull'attributo
            elevation di sun.sun). Richiesto solo con temperatura colore circadiana attiva.
          default: ""
          selector:
            entity:
              domain: sensor

        morning_color_temp_kelvin:
          name: Temperatura colore mattina (K)
          description: >-
            Fase mattutina, sole in salita (~6°→25°). Tipici 3000-3800K. 0 = usa la temperatura giorno.
          default: 3500
          selector:
            number:
              min: 0
              max: 6500
              step: 100
              mode: slider
              unit_of_measurement: K

        evening_color_temp_kelvin:
          name: Temperatura colore sera (K)
          description: >-
            Fase serale, sole in discesa (~25°→6°). Tipici 2800-3500K. 0 = usa la temperatura giorno.
          default: 3000
          selector:
            number:
              min: 0
              max: 6500
              step: 100
              mode: slider
              unit_of_measurement: K

        noon_color_temp_kelvin:
          name: Temperatura colore picco mezzogiorno (K)
          description: >-
            Bianco al picco di elevazione. Se > temperatura giorno, la luce si raffredda
            verso mezzogiorno (picco ~55°). 0 = disabilita il picco (resta a day_k).
          default: 0
          selector:
            number:
              min: 0
              max: 6500
              step: 100
              mode: slider
              unit_of_measurement: K

        circadian_transition_minutes:
          name: Durata transizione colore circadiana (min)
          description: >-
            Durata della transizione morbida all'accensione in modalità circadiana.
            0 = usa la transizione di accensione normale.
          default: 5
          selector:
            number:
              min: 0
              max: 60
              step: 1
              mode: slider
              unit_of_measurement: min

        enable_circadian_periodic_update:
          name: Aggiornamento circadiano periodico (transizione continua)
          description: >-
            Mentre la luce è accesa, aggiorna la temperatura colore ogni N minuti in base
            all'elevazione solare corrente (transizione = intervallo, nessun salto).
            Con mode=restart il loop si interrompe al trigger di assenza.
            Richiede temperatura colore circadiana attiva.
          default: false
          selector:
            boolean: {}

        circadian_update_interval_minutes:
          name: Intervallo aggiornamento circadiano (min)
          description: Ogni quanti minuti aggiornare la temperatura colore. Consigliato 5 min.
          default: 5
          selector:
            number:
              min: 1
              max: 30
              step: 1
              mode: slider
              unit_of_measurement: min

    # ─────────────────────────────────────────────────────────────
    # MODALITÀ SCENE (avanzato)
    # ─────────────────────────────────────────────────────────────
    scenes:
      name: 🎬 Modalità scene (avanzato)
      icon: mdi:palette
      collapsed: true
      input:
        brightness_mode:
          name: Modalità controllo luci
          description: >-
            brightness_control: usa brightness + transition.
            scene_control: attiva scene giorno/notte (se configurate).
          default: brightness_control
          selector:
            select:
              options:
                - label: Controllo luminosità
                  value: brightness_control
                - label: Controllo scene
                  value: scene_control

        day_scene:
          name: Scena giorno (opzionale)
          description: Usata solo con modalità scene.
          default: ""
          selector:
            entity:
              domain: scene

        night_scene:
          name: Scena notte (opzionale)
          description: Usata solo con modalità scene.
          default: ""
          selector:
            entity:
              domain: scene

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    id: motion_on
    entity_id: !input presence_sensor
    to: "on"
    for:
      seconds: !input motion_on_debounce_seconds

  - platform: state
    id: motion_off
    entity_id: !input presence_sensor
    to: "off"
    for:
      seconds: !input motion_off_debounce_seconds

  # Trigger secondo sensore di movimento (open space, opzionale)
  # Se presence_sensor_2 non è configurato, l'entity_id sarà "" e il trigger non si attiverà mai.
  - platform: state
    id: motion_on_2
    entity_id: !input presence_sensor_2
    to: "on"
    for:
      seconds: !input motion_on_debounce_seconds

  - platform: state
    id: motion_off_2
    entity_id: !input presence_sensor_2
    to: "off"
    for:
      seconds: !input motion_off_debounce_seconds

  # Trigger calo lux: si attiva solo se enable_lux_trigger è abilitato.
  - platform: numeric_state
    id: lux_below_threshold
    enabled: !input enable_lux_trigger
    entity_id: !input lux_sensor
    below: !input day_lux_threshold
    for:
      seconds: !input lux_trigger_stability_seconds

  # Trigger salita lux: si attiva solo se enable_lux_off è abilitato.
  # Spegne le luci quando c'è abbastanza luce naturale, anche in presenza.
  - platform: numeric_state
    id: lux_above_threshold
    enabled: !input enable_lux_off
    entity_id: !input lux_sensor
    above: !input lux_off_threshold
    for:
      seconds: !input lux_off_stability_seconds

variables:
  presence_sensor: !input presence_sensor
  presence_sensor_2: !input presence_sensor_2
  has_presence_sensor_2: "{{ presence_sensor_2 | string | length > 0 }}"
  mmwave_sensor: !input mmwave_sensor
  mmwave_sensor_2: !input mmwave_sensor_2
  enable_mmwave_timeout: !input enable_mmwave_timeout
  mmwave_keep_on_timeout_seconds: !input mmwave_keep_on_timeout_seconds
  has_mmwave: "{{ mmwave_sensor | string | length > 0 }}"
  has_mmwave_2: "{{ mmwave_sensor_2 | string | length > 0 }}"
  any_mmwave_on: >-
    {{ (has_mmwave | bool(false) and is_state(mmwave_sensor, 'on')) or
       (has_mmwave_2 | bool(false) and is_state(mmwave_sensor_2, 'on')) }}
  lux_sensor: !input lux_sensor
  twilight_sensor: !input twilight_sensor
  has_twilight_sensor: "{{ twilight_sensor | string | length > 0 }}"
  light_target: !input light_target

  automation_enabled: !input automation_enabled
  manual_override_helper: !input manual_override_helper
  keep_auto_off_during_override: !input keep_auto_off_during_override
  skip_if_light_already_on: !input skip_if_light_already_on

  enable_night_mode: !input enable_night_mode
  night_detection_mode: !input night_detection_mode
  night_start_time: !input night_start_time
  night_end_time: !input night_end_time
  sunset_offset_minutes: !input sunset_offset_minutes
  sunrise_offset_minutes: !input sunrise_offset_minutes
  lux_night_detection_threshold: !input lux_night_detection_threshold

  enable_lux_check: !input enable_lux_check
  enable_lux_trigger: !input enable_lux_trigger
  lux_trigger_stability_seconds: !input lux_trigger_stability_seconds
  lux_fallback_value: !input lux_fallback_value

  day_lux_threshold: !input day_lux_threshold
  day_brightness_pct: !input day_brightness_pct
  day_transition_seconds: !input day_transition_seconds
  day_no_motion_timeout_seconds: !input day_no_motion_timeout_seconds

  night_lux_threshold: !input night_lux_threshold
  night_brightness_pct: !input night_brightness_pct
  night_transition_seconds: !input night_transition_seconds
  night_no_motion_timeout_seconds: !input night_no_motion_timeout_seconds

  min_time_between_runs_seconds: !input min_time_between_runs_seconds
  brightness_mode: !input brightness_mode
  day_scene: !input day_scene
  night_scene: !input night_scene

  enable_pre_off_dim: !input enable_pre_off_dim
  pre_off_dim_brightness_pct: !input pre_off_dim_brightness_pct
  pre_off_dim_duration_seconds: !input pre_off_dim_duration_seconds
  off_transition_seconds: !input off_transition_seconds
  enable_lux_off: !input enable_lux_off
  lux_off_threshold: !input lux_off_threshold
  lux_off_stability_seconds: !input lux_off_stability_seconds

  # Stato override manuale robusto (helper opzionale)
  # NOTA: espressione singola {{ }} per restituire un boolean nativo (non una stringa).
  override_active: "{{ (manual_override_helper | string | length > 0) and is_state(manual_override_helper, 'on') }}"

  # Parsing lux robusto con fallback
  current_lux_raw: "{{ states(lux_sensor) }}"
  valid_lux: >-
    {{ current_lux_raw not in ['unknown', 'unavailable', 'none', 'None', '']
       and (current_lux_raw | float(none)) is not none }}
  current_lux: >-
    {% if valid_lux %}
      {{ current_lux_raw | float }}
    {% else %}
      {{ lux_fallback_value | float }}
    {% endif %}

  # Parsing lux sensore crepuscolare esterno (opzionale, usato per decidere la notte)
  twilight_lux_raw: >-
    {% if has_twilight_sensor %}
      {{ states(twilight_sensor) }}
    {% else %}
      {{ current_lux_raw }}
    {% endif %}
  valid_twilight_lux: >-
    {{ twilight_lux_raw not in ['unknown', 'unavailable', 'none', 'None', '']
       and (twilight_lux_raw | float(none)) is not none }}
  twilight_lux: >-
    {% if valid_twilight_lux %}
      {{ twilight_lux_raw | float }}
    {% else %}
      {{ lux_fallback_value | float }}
    {% endif %}

  # Rilevamento notte: time_based, sun_based, o lux_based (sensore crepuscolare esterno).
  # Usa namespace + {%- -%} per produrre esattamente "True"/"False" senza spazi.
  is_night: >-
    {%- set ns = namespace(v=false) -%}
    {%- if enable_night_mode -%}
      {%- if night_detection_mode == 'time_based' -%}
        {%- set start = today_at(night_start_time) -%}
        {%- set stop = today_at(night_end_time) -%}
        {%- if start <= stop -%}
          {%- set ns.v = now() >= start and now() < stop -%}
        {%- else -%}
          {%- set ns.v = now() >= start or now() < stop -%}
        {%- endif -%}
      {%- elif night_detection_mode == 'lux_based' -%}
        {%- set lux_val = twilight_lux | float(lux_fallback_value | float(999)) -%}
        {%- set ns.v = lux_val < (lux_night_detection_threshold | float(50)) -%}
      {%- else -%}
        {%- set now_ts = as_timestamp(now()) -%}
        {%- set next_rising = as_timestamp(state_attr('sun.sun', 'next_rising')) -%}
        {%- set next_setting = as_timestamp(state_attr('sun.sun', 'next_setting')) -%}
        {%- set sunrise_off = (sunrise_offset_minutes | int(0)) * 60 -%}
        {%- set sunset_off = (sunset_offset_minutes | int(0)) * 60 -%}
        {%- if next_rising is number and next_setting is number -%}
          {%- if next_setting > next_rising -%}
            {%- set prev_setting = next_setting - 86400 -%}
            {%- set ns.v = now_ts >= (prev_setting + sunset_off) or now_ts < (next_rising + sunrise_off) -%}
          {%- else -%}
            {%- set prev_rising = next_rising - 86400 -%}
            {%- set ns.v = now_ts >= (next_setting + sunset_off) or now_ts < (prev_rising + sunrise_off) -%}
          {%- endif -%}
        {%- else -%}
          {%- set ns.v = is_state('sun.sun', 'below_horizon') -%}
        {%- endif -%}
      {%- endif -%}
    {%- endif -%}
    {{ ns.v }}

  active_lux_threshold: "{{ night_lux_threshold if is_night | bool else day_lux_threshold }}"

  enable_adaptive_brightness: !input enable_adaptive_brightness
  adaptive_brightness_min_pct: !input adaptive_brightness_min_pct

  # Luminosità adattiva: se abilitata, scala linearmente tra base (buio totale) e minimo (lux vicino a soglia).
  active_brightness: >-
    {%- set base = (night_brightness_pct if is_night | bool else day_brightness_pct) | int(100) -%}
    {%- if enable_adaptive_brightness | bool(false) and enable_lux_check | bool(true)
           and valid_lux and (active_lux_threshold | float(0)) > 0 -%}
      {%- set ratio = [0.0, [1.0, (current_lux | float(0)) / (active_lux_threshold | float(1))] | min] | max -%}
      {%- set min_b = adaptive_brightness_min_pct | int(20) -%}
      {%- set result = (min_b + (base - min_b) * (1.0 - ratio)) | round | int -%}
      {{ [min_b, [base, result] | min] | max }}
    {%- else -%}
      {{ base }}
    {%- endif -%}
  active_transition: "{{ night_transition_seconds if is_night | bool else day_transition_seconds }}"
  active_timeout: "{{ night_no_motion_timeout_seconds if is_night | bool else day_no_motion_timeout_seconds }}"
  # Transizione colore circadiana: se attiva e circadian_transition_minutes > 0, usa una transizione più lunga.
  active_color_transition: >-
    {%- if enable_color_temp | bool(false) and enable_circadian_color_temp | bool(false)
           and (circadian_transition_minutes | int(0)) > 0 -%}
      {{ circadian_transition_minutes | int(0) * 60 }}
    {%- else -%}
      {{ active_transition }}
    {%- endif -%}

  enable_color_temp: !input enable_color_temp
  day_color_temp_kelvin: !input day_color_temp_kelvin
  night_color_temp_kelvin: !input night_color_temp_kelvin
  enable_circadian_color_temp: !input enable_circadian_color_temp
  noon_color_temp_kelvin: !input noon_color_temp_kelvin
  morning_color_temp_kelvin: !input morning_color_temp_kelvin
  evening_color_temp_kelvin: !input evening_color_temp_kelvin
  circadian_transition_minutes: !input circadian_transition_minutes
  enable_circadian_periodic_update: !input enable_circadian_periodic_update
  circadian_update_interval_minutes: !input circadian_update_interval_minutes
  solar_elevation_entity: !input solar_elevation_entity

  # Temperatura colore attiva: se circadiana abilitata, segue una curva continua multi-fase
  # basata sull'elevazione solare (smoothstep cubico s(t)=t²·(3−2t)).
  # Fase MATTUTINA (sun.rising=true): ≤−6° night_k · −6°→6° alba→morning_k · 6°→25° →day_k · 25°→55° →noon_k
  # Fase SERALE   (sun.rising=false): >55° noon_k · 55°→25° →day_k · 25°→6° →evening_k · 6°→−6° →night_k
  active_color_temp: >-
    {%- set day_k   = day_color_temp_kelvin   | int(4000) -%}
    {%- set night_k = night_color_temp_kelvin | int(2700) -%}
    {%- if not (enable_circadian_color_temp | bool(false)) -%}
      {{ night_k if is_night | bool else day_k }}
    {%- else -%}
      {%- set morning_k_raw = morning_color_temp_kelvin | int(0) -%}
      {%- set morning_k = morning_k_raw if morning_k_raw > 0 else day_k -%}
      {%- set evening_k_raw = evening_color_temp_kelvin | int(0) -%}
      {%- set evening_k = evening_k_raw if evening_k_raw > 0 else day_k -%}
      {%- set elev      = states(solar_elevation_entity) | float(0) -%}
      {%- set noon_k    = noon_color_temp_kelvin | int(0) -%}
      {%- set noon_k    = noon_k if noon_k > day_k else day_k -%}
      {%- set sun_rising = state_attr('sun.sun', 'rising') | bool(true) -%}
      {%- set e_night = -6.0 -%}
      {%- set e_gold  =  6.0 -%}
      {%- set e_day   = 25.0 -%}
      {%- set e_noon  = 55.0 -%}
      {%- if elev <= e_night -%}
        {{ night_k }}
      {%- elif sun_rising -%}
        {%- if elev <= e_gold -%}
          {%- set t = (elev - e_night) / (e_gold - e_night) -%}
          {%- set t = [0.0, [1.0, t] | min] | max -%}
          {%- set s = t * t * (3.0 - 2.0 * t) -%}
          {{ (night_k + (morning_k - night_k) * s) | round | int }}
        {%- elif elev <= e_day -%}
          {%- set t = (elev - e_gold) / (e_day - e_gold) -%}
          {%- set t = [0.0, [1.0, t] | min] | max -%}
          {%- set s = t * t * (3.0 - 2.0 * t) -%}
          {{ (morning_k + (day_k - morning_k) * s) | round | int }}
        {%- elif noon_k > day_k and elev <= e_noon -%}
          {%- set t = (elev - e_day) / (e_noon - e_day) -%}
          {%- set t = [0.0, [1.0, t] | min] | max -%}
          {%- set s = t * t * (3.0 - 2.0 * t) -%}
          {{ (day_k + (noon_k - day_k) * s) | round | int }}
        {%- elif noon_k > day_k -%}
          {{ noon_k }}
        {%- else -%}
          {{ day_k }}
        {%- endif -%}
      {%- else -%}
        {%- if elev > e_noon -%}
          {{ noon_k }}
        {%- elif elev > e_day -%}
          {%- set t = (elev - e_day) / (e_noon - e_day) -%}
          {%- set t = [0.0, [1.0, t] | min] | max -%}
          {%- set s = t * t * (3.0 - 2.0 * t) -%}
          {{ (day_k + (noon_k - day_k) * s) | round | int }}
        {%- elif elev > e_gold -%}
          {%- set t = (elev - e_gold) / (e_day - e_gold) -%}
          {%- set t = [0.0, [1.0, t] | min] | max -%}
          {%- set s = t * t * (3.0 - 2.0 * t) -%}
          {{ (evening_k + (day_k - evening_k) * s) | round | int }}
        {%- else -%}
          {%- set t = (elev - e_night) / (e_gold - e_night) -%}
          {%- set t = [0.0, [1.0, t] | min] | max -%}
          {%- set s = t * t * (3.0 - 2.0 * t) -%}
          {{ (night_k + (evening_k - night_k) * s) | round | int }}
        {%- endif -%}
      {%- endif -%}
    {%- endif -%}

  # Antirimbalzo tra run (rilevante per accensioni)
  now_ts: "{{ as_timestamp(now()) }}"
  last_run_ts: "{{ as_timestamp(this.attributes.last_triggered, 0) }}"
  enough_time_since_last_run: >-
    {{ (now_ts - last_run_ts) >= (min_time_between_runs_seconds | int(0)) }}

action:
  - choose:
      # ═══════════════════════════════════════════════════════════════════
      # 1) ACCENSIONE — da movimento (sensore 1/2) OPPURE da calo lux con presenza.
      #    I due casi condividono la stessa sequenza di accensione; differiscono solo
      #    nelle condizioni che li abilitano (unificate qui sotto per evitare duplicazione).
      #
      #    Nota: enough_time_since_last_run è richiesto SOLO per il trigger lux. Per il
      #    movimento NON è usato: con mode: restart, quando motion_on interrompe un countdown
      #    motion_off, last_triggered viene aggiornato a "adesso" da HA prima dell'action,
      #    causando un falso blocco. Il debounce del trigger filtra già i glitch PIR.
      # ═══════════════════════════════════════════════════════════════════
      - conditions:
          - condition: template
            value_template: "{{ automation_enabled }}"
          - condition: template
            value_template: "{{ not override_active }}"
          - condition: template
            value_template: >-
              {{ (not skip_if_light_already_on) or
                 expand(light_target.entity_id) | selectattr('state', 'eq', 'on') | list | count == 0 }}
          - condition: template
            value_template: >-
              {{
                (trigger.id in ['motion_on', 'motion_on_2']
                   and ((not enable_lux_check) or ((current_lux | float(999999)) < (active_lux_threshold | float(0)))))
                or
                (trigger.id == 'lux_below_threshold'
                   and enable_lux_trigger and enable_lux_check
                   and (is_state(presence_sensor, 'on')
                        or (has_presence_sensor_2 | bool(false) and is_state(presence_sensor_2, 'on')))
                   and enough_time_since_last_run
                   and ((current_lux | float(999999)) < (active_lux_threshold | float(0))))
              }}
        sequence:
          # Accensione: scena, oppure luminosità (+ temperatura colore se abilitata).
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ brightness_mode == 'scene_control' }}"
                  - condition: template
                    value_template: >-
                      {{ (is_night | bool and (night_scene | string | length > 0))
                         or ((not (is_night | bool)) and (day_scene | string | length > 0)) }}
                sequence:
                  - service: scene.turn_on
                    target:
                      entity_id: "{{ night_scene if is_night | bool else day_scene }}"
            default:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ enable_color_temp | bool }}"
                    sequence:
                      - service: light.turn_on
                        target: !input light_target
                        data:
                          brightness_pct: "{{ active_brightness | int(100) }}"
                          transition: "{{ active_color_transition | int(0) }}"
                          color_temp_kelvin: "{{ active_color_temp | int(4000) }}"
                default:
                  - service: light.turn_on
                    target: !input light_target
                    data:
                      brightness_pct: "{{ active_brightness | int(100) }}"
                      transition: "{{ active_transition | int(0) }}"
          # Aggiornamento circadiano periodico: loop attivo mentre la luce è accesa.
          # Ogni N minuti ri-calcola la temperatura colore con l'elevazione solare corrente
          # e la invia con una transizione = intervallo (continuità perfetta).
          # Con mode=restart il loop viene interrotto dal trigger motion_off, che gestisce
          # il countdown di spegnimento senza interferenze.
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (brightness_mode != 'scene_control')
                         and (enable_color_temp | bool(false))
                         and (enable_circadian_color_temp | bool(false))
                         and (enable_circadian_periodic_update | bool(false)) }}
                sequence:
                  - repeat:
                      while:
                        - condition: template
                          value_template: >-
                            {{ expand(light_target.entity_id) | selectattr('state', 'eq', 'on') | list | count > 0 }}
                      sequence:
                        - delay:
                            minutes: "{{ circadian_update_interval_minutes | int(5) }}"
                        - condition: template
                          value_template: >-
                            {{ expand(light_target.entity_id) | selectattr('state', 'eq', 'on') | list | count > 0
                               and not ((manual_override_helper | string | length > 0) and is_state(manual_override_helper, 'on')) }}
                        - service: light.turn_on
                          target: !input light_target
                          data:
                            color_temp_kelvin: >-
                              {%- set day_k   = day_color_temp_kelvin   | int(4000) -%}
                              {%- set night_k = night_color_temp_kelvin | int(2700) -%}
                              {%- set morning_k_raw = morning_color_temp_kelvin | int(0) -%}
                              {%- set morning_k = morning_k_raw if morning_k_raw > 0 else day_k -%}
                              {%- set evening_k_raw = evening_color_temp_kelvin | int(0) -%}
                              {%- set evening_k = evening_k_raw if evening_k_raw > 0 else day_k -%}
                              {%- set elev = states(solar_elevation_entity) | float(0) -%}
                              {%- set noon_k_raw = noon_color_temp_kelvin | int(0) -%}
                              {%- set noon_k = noon_k_raw if noon_k_raw > day_k else day_k -%}
                              {%- set sun_rising = state_attr('sun.sun', 'rising') | bool(true) -%}
                              {%- set e_night = -6.0 -%}
                              {%- set e_gold  =  6.0 -%}
                              {%- set e_day   = 25.0 -%}
                              {%- set e_noon  = 55.0 -%}
                              {%- if elev <= e_night -%}
                                {{ night_k }}
                              {%- elif sun_rising -%}
                                {%- if elev <= e_gold -%}
                                  {%- set t = (elev - e_night) / (e_gold - e_night) -%}
                                  {%- set t = [0.0, [1.0, t] | min] | max -%}
                                  {%- set s = t * t * (3.0 - 2.0 * t) -%}
                                  {{ (night_k + (morning_k - night_k) * s) | round | int }}
                                {%- elif elev <= e_day -%}
                                  {%- set t = (elev - e_gold) / (e_day - e_gold) -%}
                                  {%- set t = [0.0, [1.0, t] | min] | max -%}
                                  {%- set s = t * t * (3.0 - 2.0 * t) -%}
                                  {{ (morning_k + (day_k - morning_k) * s) | round | int }}
                                {%- elif noon_k > day_k and elev <= e_noon -%}
                                  {%- set t = (elev - e_day) / (e_noon - e_day) -%}
                                  {%- set t = [0.0, [1.0, t] | min] | max -%}
                                  {%- set s = t * t * (3.0 - 2.0 * t) -%}
                                  {{ (day_k + (noon_k - day_k) * s) | round | int }}
                                {%- elif noon_k > day_k -%}
                                  {{ noon_k }}
                                {%- else -%}
                                  {{ day_k }}
                                {%- endif -%}
                              {%- else -%}
                                {%- if elev > e_noon -%}
                                  {{ noon_k }}
                                {%- elif elev > e_day -%}
                                  {%- set t = (elev - e_day) / (e_noon - e_day) -%}
                                  {%- set t = [0.0, [1.0, t] | min] | max -%}
                                  {%- set s = t * t * (3.0 - 2.0 * t) -%}
                                  {{ (day_k + (noon_k - day_k) * s) | round | int }}
                                {%- elif elev > e_gold -%}
                                  {%- set t = (elev - e_gold) / (e_day - e_gold) -%}
                                  {%- set t = [0.0, [1.0, t] | min] | max -%}
                                  {%- set s = t * t * (3.0 - 2.0 * t) -%}
                                  {{ (evening_k + (day_k - evening_k) * s) | round | int }}
                                {%- else -%}
                                  {%- set t = (elev - e_night) / (e_gold - e_night) -%}
                                  {%- set t = [0.0, [1.0, t] | min] | max -%}
                                  {%- set s = t * t * (3.0 - 2.0 * t) -%}
                                  {{ (night_k + (evening_k - night_k) * s) | round | int }}
                                {%- endif -%}
                              {%- endif -%}
                            transition: "{{ (circadian_update_interval_minutes | int(5)) * 60 }}"

      # ═══════════════════════════════════════════════════════════════════
      # 2) Trigger calo lux con ASSENZA rilevata -> spegnimento di sicurezza.
      #    Gestisce il caso: lux scende con stanza vuota (nessun countdown motion_off in corso).
      #    Open space: solo se ENTRAMBI i sensori sono liberi.
      # ═══════════════════════════════════════════════════════════════════
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'lux_below_threshold' }}"
          - condition: template
            value_template: "{{ automation_enabled }}"
          - condition: template
            value_template: >-
              {{ is_state(presence_sensor, 'off') and
                 (not (has_presence_sensor_2 | bool(false)) or is_state(presence_sensor_2, 'off')) }}
        sequence:
          # Brevissima attesa di stabilizzazione (5s) prima di spegnere.
          # NOTA: non usare delay lungo: con mode=restart un altro trigger lux durante l'attesa
          # riavvia questo caso da capo, creando un loop infinito che impedisce lo spegnimento.
          # Il debounce reale è già garantito da lux_trigger_stability_seconds a livello di trigger.
          - delay:
              seconds: 5
          - condition: template
            value_template: >-
              {{ is_state(presence_sensor, 'off') and
                 (not (has_presence_sensor_2 | bool(false)) or is_state(presence_sensor_2, 'off')) }}
          - condition: template
            value_template: >-
              {{ (not ((manual_override_helper | string | length > 0) and is_state(manual_override_helper, 'on')))
                 or keep_auto_off_during_override }}
          - service: light.turn_off
            target: !input light_target
            data:
              transition: "{{ off_transition_seconds | int(0) }}"

      # ═══════════════════════════════════════════════════════════════════
      # 3) SPEGNIMENTO — assenza movimento (sensore 1/2), mai legato ai lux.
      #    Open space: spegne solo se entrambi i sensori di movimento sono liberi dopo il timeout.
      # ═══════════════════════════════════════════════════════════════════
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['motion_off', 'motion_off_2'] }}"
          - condition: template
            value_template: "{{ automation_enabled }}"
          - condition: template
            value_template: >-
              {{ (not override_active) or keep_auto_off_during_override }}
        sequence:
          - delay:
              seconds: "{{ active_timeout | int(0) }}"
          # mmWave: OR per mantenere accesa (basta uno attivo), AND per spegnere (entrambi liberi).
          # Se enable_mmwave_timeout è attivo, applica un timeout massimo anti-blocco.
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (has_mmwave | bool(false) and is_state(mmwave_sensor, 'on')) or
                         (has_mmwave_2 | bool(false) and is_state(mmwave_sensor_2, 'on')) }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ enable_mmwave_timeout | bool(true) }}"
                        sequence:
                          - wait_template: >-
                              {{ (not has_mmwave or is_state(mmwave_sensor, 'off')) and
                                 (not has_mmwave_2 or is_state(mmwave_sensor_2, 'off')) }}
                            timeout:
                              seconds: "{{ mmwave_keep_on_timeout_seconds | int(600) }}"
                            continue_on_timeout: true
                    default:
                      - wait_template: >-
                          {{ (not has_mmwave or is_state(mmwave_sensor, 'off')) and
                             (not has_mmwave_2 or is_state(mmwave_sensor_2, 'off')) }}
          # Open space: verifica che ENTRAMBI i sensori siano liberi prima di procedere.
          - condition: template
            value_template: >-
              {{ is_state(presence_sensor, 'off') and
                 (not (has_presence_sensor_2 | bool(false)) or is_state(presence_sensor_2, 'off')) }}
          - condition: template
            value_template: >-
              {{ (not ((manual_override_helper | string | length > 0) and is_state(manual_override_helper, 'on')))
                 or keep_auto_off_during_override }}
          # Pre-spegnimento con dissolvenza (opzionale): avviso visivo prima dello spegnimento.
          # Se torna il movimento durante il dimming, mode=restart riporta le luci piene.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_pre_off_dim | bool(false) }}"
                sequence:
                  - service: light.turn_on
                    target: !input light_target
                    data:
                      brightness_pct: "{{ pre_off_dim_brightness_pct | int(10) }}"
                      transition: "{{ off_transition_seconds | int(0) }}"
                  - delay:
                      seconds: "{{ pre_off_dim_duration_seconds | int(15) }}"
                  - condition: template
                    value_template: >-
                      {{ is_state(presence_sensor, 'off') and
                         (not (has_presence_sensor_2 | bool(false)) or is_state(presence_sensor_2, 'off')) }}
          # Ricontrolla mmWave dopo il pre-spegnimento: se un radar si è riattivato durante il dimming,
          # attende di nuovo che entrambi si liberino prima di spegnere.
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (has_mmwave | bool(false) and is_state(mmwave_sensor, 'on')) or
                         (has_mmwave_2 | bool(false) and is_state(mmwave_sensor_2, 'on')) }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ enable_mmwave_timeout | bool(true) }}"
                        sequence:
                          - wait_template: >-
                              {{ (not has_mmwave or is_state(mmwave_sensor, 'off')) and
                                 (not has_mmwave_2 or is_state(mmwave_sensor_2, 'off')) }}
                            timeout:
                              seconds: "{{ mmwave_keep_on_timeout_seconds | int(600) }}"
                            continue_on_timeout: true
                    default:
                      - wait_template: >-
                          {{ (not has_mmwave or is_state(mmwave_sensor, 'off')) and
                             (not has_mmwave_2 or is_state(mmwave_sensor_2, 'off')) }}
          # Spegnimento definitivo con transizione morbida
          - service: light.turn_off
            target: !input light_target
            data:
              transition: "{{ off_transition_seconds | int(0) }}"

      # ═══════════════════════════════════════════════════════════════════
      # 4) SPEGNIMENTO per luce naturale sufficiente (opzionale).
      #    Quando il lux sale sopra lux_off_threshold, spegne le luci ANCHE in presenza:
      #    di giorno c'è già abbastanza luce, quindi si risparmia energia. Se poi torna
      #    il buio ed enable_lux_trigger è attivo, le luci si riaccendono da sole.
      # ═══════════════════════════════════════════════════════════════════
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'lux_above_threshold' }}"
          - condition: template
            value_template: "{{ automation_enabled }}"
          - condition: template
            value_template: "{{ enable_lux_off }}"
          - condition: template
            value_template: >-
              {{ (not ((manual_override_helper | string | length > 0) and is_state(manual_override_helper, 'on')))
                 or keep_auto_off_during_override }}
          # Riconferma che il lux è davvero ancora sopra la soglia al momento dell'azione.
          - condition: template
            value_template: >-
              {{ (current_lux | float(0)) >= (lux_off_threshold | float(999999)) }}
        sequence:
          - service: light.turn_off
            target: !input light_target
            data:
              transition: "{{ off_transition_seconds | int(0) }}"
